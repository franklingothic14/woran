<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Präpositionen Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="phone">
    <div class="notch"></div>

    <div class="header" id="main-header">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
        <div class="title">Präpositionen</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="hint-toggle" id="hint-toggle" onclick="toggleHint()">
            <span id="hint-icon">👁</span>
          </button>
          <div class="lang-toggle">
            <button class="lang-btn active" id="btn-ua" onclick="setLang('ua')">UA</button>
            <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
            <button class="lang-btn" id="btn-hu" onclick="setLang('hu')">HU</button>
          </div>
        </div>
      </div>
      <div class="progress-row">
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <div class="progress-label" id="progress-label">1 / 116</div>
      </div>
    </div>

    <div class="score-row">
      <div class="chip"><span class="chip-num green" id="correct-count">0</span><span>Richtig</span></div>
      <div class="chip"><span class="chip-num red" id="wrong-count">0</span><span>Falsch</span></div>
    </div>

    <div class="q-card fade" id="quiz-card">
      <div class="q-label" id="q-num">Frage 1</div>
      <div class="verb-row" id="verb-row"></div>
      <div class="sentence" id="sentence-text"></div>
    </div>

    <div class="options" id="options-grid"></div>

    <div class="results" id="results">
      <div class="results-icon" id="results-icon">🏆</div>
      <div class="results-score" id="results-score">0/116</div>
      <div class="results-sub">Ergebnis</div>
      <div class="results-msg" id="results-msg"></div>
      <button class="restart-btn" onclick="restartQuiz()">Nochmal spielen ↺</button>
    </div>

    <div class="log-section">
      <div class="log-header">
        <span class="log-title">Verlauf</span>
        <button class="log-clear" onclick="clearLog()">✕ löschen</button>
      </div>
      <div class="log-list" id="log-list"></div>
    </div>

  </div>

  <script src="questions.js"></script>
  <script>
    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

    let shuffledQ = [], current = 0, correct = 0, wrong = 0, answered = false;
    let currentLang = 'ua', hintVisible = true;

    function init() {
      shuffledQ = shuffle(questions);
      current = 0; correct = 0; wrong = 0;
      document.getElementById('correct-count').textContent = 0;
      document.getElementById('wrong-count').textContent = 0;
      document.getElementById('results').classList.remove('show');
      document.getElementById('quiz-card').style.display = '';
      document.getElementById('options-grid').style.display = '';
      document.getElementById('main-header').style.display = '';
      document.querySelector('.score-row').style.display = '';
      document.getElementById('progress-fill').style.width = '0%';
      loadQuestion();
    }

    function loadQuestion() {
      answered = false;
      const q = shuffledQ[current];
      const total = shuffledQ.length;
      document.getElementById('q-num').textContent = `Frage ${current + 1} von ${total}`;
      document.getElementById('progress-label').textContent = `${current + 1} / ${total}`;
      document.getElementById('progress-fill').style.width = `${(current / total) * 100}%`;
      document.getElementById('sentence-text').innerHTML = q.sentence.replace('___', '<span class="blank">___</span>');
      const verbRow = document.getElementById('verb-row');
      const transl = currentLang === 'ua' ? q.translation : currentLang === 'hu' ? q.translationHu : q.translationEn;
      verbRow.innerHTML = `<span class="verb-tag">${q.verb}</span><span class="verb-translation">${transl}</span>`;
      verbRow.classList.toggle('hidden', !hintVisible);
      const grid = document.getElementById('options-grid');
      grid.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];
      shuffle(q.options).forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = `<span>${opt}</span><span class="opt-icon">${letters[i]}</span>`;
        btn.onclick = () => checkAnswer(opt, btn, q);
        grid.appendChild(btn);
      });
    }

    function checkAnswer(chosen, btn, q) {
      if (answered) return;
      answered = true;
      document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
      const isCorrect = chosen === q.answer;
      if (isCorrect) {
        btn.classList.add('correct');
        btn.querySelector('.opt-icon').textContent = '✓';
        correct++;
        document.getElementById('correct-count').textContent = correct;
      } else {
        btn.classList.add('wrong');
        btn.querySelector('.opt-icon').textContent = '✗';
        wrong++;
        document.getElementById('wrong-count').textContent = wrong;
        document.querySelectorAll('.opt-btn').forEach(b => {
          if (b.querySelector('span').textContent === q.answer) {
            b.classList.add('correct');
            b.querySelector('.opt-icon').textContent = '✓';
          }
        });
      }
      addLogEntry(isCorrect, q, chosen);
      setTimeout(nextQuestion, 3000);
    }

    function addLogEntry(isCorrect, q, chosen) {
      const list = document.getElementById('log-list');
      const filled = q.sentence.replace('___', `<strong class="${isCorrect ? 'log-correct-word' : 'log-wrong-word'}">${q.answer}</strong>`);
      const wrongPart = !isCorrect ? ` <span class="log-chosen">← обрав: <em>${chosen}</em></span>` : '';
      const caseTag = q.case.includes('Akkusativ')
        ? '<span class="log-case-tag akk">Akk</span>'
        : '<span class="log-case-tag dat">Dat</span>';
      const entry = document.createElement('div');
      entry.className = `log-entry ${isCorrect ? 'log-ok' : 'log-err'} log-new`;
      entry.innerHTML = `
    <div class="log-entry-top">
      <span class="log-icon">${isCorrect ? '✅' : '❌'}</span>
      <span class="log-verb">${q.verb}</span>
      ${caseTag}
    </div>
    <div class="log-sentence">${filled}${wrongPart}</div>
  `;
      list.insertBefore(entry, list.firstChild);
      setTimeout(() => entry.classList.remove('log-new'), 300);
    }

    function clearLog() { document.getElementById('log-list').innerHTML = ''; }

    function nextQuestion() {
      current++;
      if (current >= shuffledQ.length) showResults();
      else loadQuestion();
    }

    function showResults() {
      document.getElementById('quiz-card').style.display = 'none';
      document.getElementById('options-grid').style.display = 'none';
      document.querySelector('.score-row').style.display = 'none';
      document.getElementById('main-header').style.display = 'none';
      const total = shuffledQ.length;
      const pct = Math.round((correct / total) * 100);
      document.getElementById('results-score').textContent = `${correct}/${total}`;
      let icon = '🎉', msg = '';
      if (pct >= 90) { icon = '🏆'; msg = 'Ausgezeichnet! Du bist ein Präpositionen-Profi!'; }
      else if (pct >= 70) { icon = '😊'; msg = 'Sehr gut! Noch ein bisschen Übung!'; }
      else if (pct >= 50) { icon = '💪'; msg = 'Nicht schlecht! Übung macht den Meister!'; }
      else { icon = '📚'; msg = 'Weitermachen! Du schaffst das!'; }
      document.getElementById('results-icon').textContent = icon;
      document.getElementById('results-msg').textContent = msg;
      document.getElementById('results').classList.add('show');
    }

    function restartQuiz() {
      document.querySelector('.score-row').style.display = '';
      document.getElementById('main-header').style.display = '';
      clearLog();
      init();
    }

    function setLang(lang) {
      currentLang = lang;
      ['ua', 'en', 'hu'].forEach(l => document.getElementById(`btn-${l}`).classList.toggle('active', l === lang));
      if (shuffledQ.length && current < shuffledQ.length) {
        const q = shuffledQ[current];
        const vr = document.getElementById('verb-row');
        const t = currentLang === 'ua' ? q.translation : currentLang === 'hu' ? q.translationHu : q.translationEn;
        if (vr) vr.innerHTML = `<span class="verb-tag">${q.verb}</span><span class="verb-translation">${t}</span>`;
      }
    }

    function toggleHint() {
      hintVisible = !hintVisible;
      document.getElementById('verb-row').classList.toggle('hidden', !hintVisible);
      document.getElementById('hint-toggle').classList.toggle('off', !hintVisible);
      document.getElementById('hint-icon').textContent = hintVisible ? '👁' : '🙈';
    }

    init();
  </script>
</body>

</html>
